name: Deploy to GitHub Pages

on:
  push:
    # Deploy from both main and the repo's current default branch. GitHub's
    # auto-created `github-pages` environment only permits deployments from the
    # default branch, which on this repo is the claude/* branch (it was pushed
    # first), so it must be included or the deploy job is blocked.
    branches: [main, claude/amoeba-m0-scaffold-OWdlR]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Attempt to auto-enable Pages; if the org blocks it, enable it once via
      # Settings -> Pages -> Source: "GitHub Actions".
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
